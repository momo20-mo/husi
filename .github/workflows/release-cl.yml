name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      no-publish:
        description: Build artifacts without publishing a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.version.outputs.release-tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' husi.properties | head -n 1)"
          if [ -z "$version" ]; then
            echo "VERSION_NAME is missing from husi.properties" >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Pushed tag '$GITHUB_REF_NAME' does not match husi.properties version '$tag'" >&2
            exit 1
          fi
          echo "release-tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/load-build-versions
      - uses: ./.github/actions/setup-ndk
      - uses: ./.github/actions/setup-jbr
      - uses: ./.github/actions/gradle-cache
        with:
          read-only: 'true'
          build-cache-name: release-android
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: ./.github/actions/go-android-cache
        with:
          read-only: 'true'
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: >-
            assets-v2-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}-${{ hashFiles('buildScript/lib/assets.sh', 'libcore/cmd/internal/ruleset_generate/**', 'libcore/go.mod', 'libcore/go.sum') }}
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets
      - name: Write signing properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: printf '%s' "$LOCAL_PROPERTIES" > local.properties
      - name: Build Android libcore
        run: make libcore_android
      - name: Download Go modules
        run: cd libcore && go mod download
      - name: Generate about libraries metadata
        run: make aboutlibraries_go aboutlibraries_android
      - name: Build Android app
        run: make apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error

 

  publish:
    needs: [android]
    if: ${{ !inputs.no-publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: android
          path: release-artifacts
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.android.outputs.release-tag }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --title "$RELEASE_TAG" --generate-notes
          fi
